<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clean Pour | Receipt</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="header-full">
        <div class="header-left">
          <a href="index.html"
            ><img src="img/IMG_4282.jpg" alt="Clean Pour Logo" class="logo"
          /></a>
        </div>
        <div class="header-center">
          <h1>CLEAN POUR</h1>
        </div>
        <div class="header-right">
          <button
            class="menu-toggle"
            aria-controls="primary-navigation"
            aria-expanded="false"
          >
            <span class="hamburger-icon">☰</span>
            <span class="visually-hidden">Menu</span>
          </button>
        </div>
        <nav id="primary-nav" class="primary-nav">
          <ul>
            <li><a href="index.html">home</a></li>
            <li><a href="schedule.html">schedule</a></li>
            <li><a href="services.html">services/pricing</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="receipt">
        <h2>Thank you for scheduling!</h2>
        <p><span class="bold">Name:</span> <span id="r-name"></span></p>
        <p><span class="bold">Phone:</span> <span id="r-phone"></span></p>
        <p><span class="bold">Email:</span> <span id="r-email"></span></p>
        <p><span class="bold">Date:</span> <span id="r-date"></span></p>
        <p><span class="bold">Time:</span> <span id="r-time"></span></p>
        <p><span class="bold">Type:</span> <span id="r-type"></span></p>
        <p><span class="bold">Comments:</span> <span id="r-comments"></span></p>
        <div class="confirmation">
          <div class="check-circle">✓</div>
          <h3 class="confirm-text">Information Received</h3>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-container">
        <div class="footer-left">
          <a href="index.html">
            <img
              src="img/IMG_4282.jpg"
              alt="Clean Pour Logo"
              class="footer-logo"
            />
          </a>
          <div class="vertical-line"></div>
          <div class="contact-info">
            <p class="footer-phone">Phone: (910) 352-1141</p>
            <p class="footer-email">Email: cleanpour910@gmail.com</p>
          </div>
        </div>
        <div class="footer-right">
          <a href="https://www.facebook.com/travisvree03" target="_blank">
            <img src="img/facebook.png" alt="Facebook" class="social-icon" />
          </a>
          <a href="https://www.instagram.com/clean_pour_llc/" target="_blank">
            <img src="img/instagram.png" alt="Instagram" class="social-icon" />
          </a>
        </div>
      </div>
    </footer>
    <script src="js/main.js"></script>

    <script>
      const params = new URLSearchParams(window.location.search);

      function fill(id, key) {
        document.getElementById(id).textContent = params.get(key) || "—";
      }

      fill("r-name", "name");
      fill("r-phone", "phone");
      fill("r-email", "email");
      fill("r-date", "date");
      fill("r-time", "time");
      fill("r-type", "text");
      fill("r-comments", "comment");
    </script>
  </body>
</html>
